<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8dff0"><title>A Sky Full of Wishes ✨</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/wishes.css">
</head>
<body class="page-wishes">
  <div class="ambient-bg" aria-hidden="true"></div><div class="decor-layer" aria-hidden="true"></div>
  <main class="surprise-wrap">
    <header class="page-heading"><p class="eyebrow">GIFT 05 · JUST FOR YOU</p><h1>A Sky Full of Wishes</h1><p>Make a wish, pick a star and let the night sparkle for you.</p></header>
    <section class="experience" id="experience" aria-live="polite"></section>
    <div class="page-controls wishes-controls">
      <button class="music-toggle" type="button" aria-pressed="false">♫ Play music</button>
      <div class="firework-controls">
        <button class="firework-toggle" type="button" aria-pressed="false">🎆 Play firecracker sound</button>
        <label for="firework-volume">Firecracker volume</label><input id="firework-volume" type="range" min="0" max="100" value="40">
        <button class="launch-fireworks" type="button">✨ Launch fireworks</button>
      </div>
      <a class="home-button" href="index.html">🏠 Back to Main Page</a>
    </div>
  </main>
  <script src="js/main.js"></script><script src="js/wishes.js"></script>
</body></html>
